<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽能農夫 - 智能電力設計 × ESG 永續發展</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部深綠色導覽列 -->
    <header class="navbar">
        <div class="container navbar-container">
            <div class="logo-area">
                <span class="logo-text">Solar Farmers</span>
            </div>
            <nav class="nav-links">
                <a href="#">首頁</a>
                <a href="#features">核心項目</a>
                <a href="https://lin.ee/uNjqsw8" target="_blank" class="nav-line-btn">LINE 線上諮詢</a>
            </nav>
        </div>
    </header>

    <!-- 核心形象大圖區（背景圖已連動至 hero.jpg） -->
    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-main-title">智能電力設計 ✕ ESG 永續鏈結</h1>
            <p class="hero-sub-title">企業綠能轉型專家，打造高效能低碳未來</p>
        </div>
    </section>

    <!-- 四大業務板塊區（照片皆已連動至您上傳的本地照片） -->
    <section id="features" class="features-section">
        <div class="container">
            <div class="features-grid">
                
                <!-- 板塊 1：地熱開發 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-geothermal.jpg" alt="地熱開發">
                    </div>
                    <h3 class="feature-title">地熱開發</h3>
                    <p class="feature-desc">公民集資 ✕ 在地優先 ✕ 社區共享</p>
                    <a href="https://line.me" target="_blank" class="line-update-btn">
                        <span>💬 點擊查看最新消息 / 聯絡 LINE</span>
                    </a>
                </div>

                <!-- 板塊 2：光電整合 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-solar.jpg" alt="光電整合">
                    </div>
                    <h3 class="feature-title">光電整合</h3>
                    <p class="feature-desc">農漁共生 ✕ 智慧能源 ✕ 微電網應用</p>
                </div>

                <!-- 板塊 3：台中示範廠 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-taichung.jpg" alt="台中示範廠">
                    </div>
                    <h3 class="feature-title">台中示範廠</h3>
                    <p class="feature-desc">綠能轉型示範場域 ✕ 智慧儲能系統應用</p>
                </div>

                <!-- 板塊 4：海外布局 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-overseas.jpg" alt="海外布局">
                    </div>
                    <h3 class="feature-title">海外布局</h3>
                    <p class="feature-desc">輸出台灣經驗 ✕ 拓展越南光儲市場</p>
                </div>

            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="footer">
        <p>&copy; 2026 Solar Farmers 太陽能農夫. All rights reserved.</p>
    </footer>

</body>
</html>
